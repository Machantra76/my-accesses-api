<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>CONTAINER SHIPPING LINE</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 20px; }
        .form-box { max-width: 450px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { width: 100%; padding: 10px; background: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<div class="form-box">
    <a href="dashboard.html" class="btn-back">← ត្រឡប់ទៅ Main Menu</a>
    <h3>CONTAINER SHIPPING LINE</h3>
    <form id="shippingForm">
        <div class="form-group">
            <label>Container No</label>
            <input type="text" id="containerNo" required>
        </div>
        <div class="form-group">
            <label>Shipping Line Name</label>
            <input type="text" id="shippingLine" placeholder="ឧទាហរណ៍: MAERSK, ONE, MSC" required>
        </div>
        <button type="submit" class="btn-save">SAVE SHIPPING LINE</button>
    </form>
</div>

<script>
    document.getElementById('shippingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const containerNo = document.getElementById('containerNo').value;
        const shippingLine = document.getElementById('shippingLine').value;

        try {
            const res = await fetch('/api/containers/shipping-line', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ containerNo, shippingLine, user: localStorage.getItem('username') })
            });
            if(res.ok) {
                alert('រក្សាទុក Shipping Line បានជោគជ័យ!');
                document.getElementById('shippingForm').reset();
            } else {
                alert('មានបញ្ហាក្នុងការ រក្សាទុក!');
            }
        } catch(err) { alert('Error: ' + err.message); }
    });
</script>

</body>
</html>
