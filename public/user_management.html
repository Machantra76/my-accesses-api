<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>USER MANAGEMENT</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 20px; }
        .form-box { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { width: 100%; padding: 10px; background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<div class="form-box">
    <a href="dashboard.html" class="btn-back">← ត្រឡប់ទៅ Main Menu</a>
    <h3>USER MANAGEMENT</h3>
    <form id="userForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="newUsername" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="userRole">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn-save">CREATE USER</button>
    </form>
</div>

<script>
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('newUsername').value;
        const password = document.getElementById('newPassword').value;
        const role = document.getElementById('userRole').value;

        try {
            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, role })
            });
            if(res.ok) {
                alert('បង្កើត User ថ្មីបានជោគជ័យ!');
                document.getElementById('userForm').reset();
            }
        } catch(err) { alert('Error: ' + err.message); }
    });
</script>

</body>
</html>
