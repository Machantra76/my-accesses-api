<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTAINER SHIPPING LINE SYSTEM</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            border: 2px solid #b22222;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #b22222;
            color: white;
            padding: 10px 20px;
            margin: -25px -25px 20px -25px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            font-weight: bold;
        }
        .btn-back {
            background: #fff;
            color: #b22222;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-back:hover { background: #f1f1f1; }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
            background: #f9f9f9;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .search-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .search-group label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }
        .search-group input, .search-group select {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .total-con-box {
            background: #fff;
            border: 2px solid #b22222;
            border-radius: 4px;
            padding: 5px 15px;
            text-align: center;
        }
        .total-con-box span.number {
            font-size: 20px;
            font-weight: bold;
            color: #b22222;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px 10px;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        tbody tr:hover { background-color: #e2e6ea; cursor: pointer; }
        tbody tr.selected { background-color: #b8daff !important; }
        
        .action-col button {
            padding: 4px 8px;
            background-color: #ffc107;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .action-col button:hover { background-color: #e0a800; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span>CONTAINER SHIPPING LINE SYSTEM</span>
        <button class="btn-back" onclick="goBack()">←ត្រឡប់ទៅ Main Menu</button>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
        <h2>ANT DRY PORT CO.,LTD</h2>
        <p style="margin: 0; font-size: 14px; color: #555;">CONTAINER SHIPPING LINE REPORT</p>
    </div>

    <div class="controls-bar">
        <div class="search-group">
            <label>CONTAINER SEARCH</label>
            <input type="text" id="txtSearch" placeholder="បញ្ចូលលេខកុងតឺន័រ..." onkeyup="filterTable()">
        </div>
        <div class="search-group">
            <label>SHIPPING LINE FILTER</label>
            <select id="cmbShippingLine" onchange="loadContainers()">
                <option value="">-- All Shipping Lines --</option>
            </select>
        </div>
        <div class="search-group">
            <label>SEARCH BY SIZE</label>
            <input type="text" id="txtSize" placeholder="ឧ. 20 ឬ 40..." onkeyup="filterTable()">
        </div>
        <div class="search-group">
            <label>TOTAL CON (IN YARD)</label>
            <div class="total-con-box">
                <span class="number" id="txtTotalCon">0</span>
            </div>
        </div>
    </div>

    <div class="table-responsive">
        <table id="shippingTable">
            <thead>
                <tr>
                    <th>NO</th>
                    <th>CONTAINER No</th>
                    <th>DATE IN/TIME</th>
                    <th>DATE OUT/TIME</th>
                    <th>SIZE</th>
                    <th>TYPE</th>
                    <th>SHIPPING LINE</th>
                    <th>LOCATION</th>
                    <th>STATUS</th>
                    <th>DAY/YARD</th>
                    <th>VESSEL/VOY</th>
                    <th>CHE-REPAIR</th>
                    <th>BOOKING No</th>
                    <th>REMARK</th>
                    <th>កែតម្រូវ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="15" style="text-align: center; padding: 20px;">กำลังទាញយកទិន្នន័យ...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = "https://my-accesses-api.onrender.com";
    let containerDataList = [];

    window.onload = async function() {
        await loadShippingLineDropdown();
        await loadContainers();
    };

    async function loadShippingLineDropdown() {
        try {
            let res = await fetch(`${API_BASE}/api/containers`);
            let json = await res.json();
            let data = json.data || json;
            
            let ddl = document.getElementById('cmbShippingLine');
            let lines = new Set();
            
            if (Array.isArray(data)) {
                data.forEach(item => {
                    if (item.shipping_line) lines.add(item.shipping_line.trim());
                });
            }

            Array.from(lines).sort().forEach(line => {
                let opt = document.createElement('option');
                opt.value = line;
                opt.textContent = line;
                ddl.appendChild(opt);
            });

            let currentRole = (localStorage.getItem("currentUserRole") || localStorage.getItem("role") || "").trim().toLowerCase();
            let userShippingLine = (localStorage.getItem("shippingLine") || localStorage.getItem("currentUser") || "").trim();

            if (currentRole === "shipping_line" && userShippingLine) {
                ddl.value = userShippingLine;
                ddl.disabled = true;
            }
        } catch (err) {
            console.error("Error loading dropdown:", err);
        }
    }

    async function loadContainers(queryParam = "") {
        try {
            let currentRole = (localStorage.getItem("currentUserRole") || localStorage.getItem("role") || "").trim().toLowerCase();
            let userShippingLine = (localStorage.getItem("shippingLine") || localStorage.getItem("currentUser") || "").trim();
            let selectedFilterLine = document.getElementById('cmbShippingLine').value;
            let queryParams = new URLSearchParams();

            if (currentRole === "shipping_line" && userShippingLine) {
                queryParams.set('shipping_line', userShippingLine);
                document.getElementById('cmbShippingLine').value = userShippingLine;
            } else if (selectedFilterLine) {
                queryParams.set('shipping_line', selectedFilterLine);
            }

            if (queryParam) {
                let params = new URLSearchParams(queryParam);
                for (let [key, value] of params.entries()) {
                    queryParams.set(key, value);
                }
            }

            let url = `${API_BASE}/api/containers?` + queryParams.toString();
            let res = await fetch(url);
            let json = await res.json();
            
            if (json.data && Array.isArray(json.data)) {
                containerDataList = json.data;
            } else if (Array.isArray(json)) {
                containerDataList = json;
            } else {
                containerDataList = [];
            }

            renderTable(containerDataList);
        } catch (err) {
            console.error("Error loading containers:", err);
        }
    }

    function renderTable(data) {
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let countInYard = 0;

        data.forEach((item, index) => {
            let rawDateIn = item.date_in || item.date_in_time || item.DATE_IN || item.DATE_IN_TIME || item.datein || "";
            let rawDateOut = item.date_out || item.date_out_time || item.DATE_OUT || "";

            let dateInStr = rawDateIn ? String(rawDateIn).replace("T", " ").replace("Z", "").substring(0, 19) : "";
            let dateOutStr = rawDateOut ? String(rawDateOut).replace("T", " ").replace("Z", "").substring(0, 19) : "";

            let dayYard = 0;
            if (dateInStr) {
                let dIn = new Date(dateInStr);
                dIn.setHours(0, 0, 0, 0);

                let dEnd = new Date();
                let statusVal = (item.status || "").toUpperCase();

                if (statusVal.includes("RELEASE") && rawDateOut) {
                    let dOut = new Date(dateOutStr);
                    if (!isNaN(dOut.getTime())) {
                        dEnd = dOut;
                    }
                }
                dEnd.setHours(0, 0, 0, 0);

                if (!isNaN(dIn.getTime())) {
                    let diffTime = dEnd - dIn;
                    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    dayYard = diffDays >= 0 ? diffDays : 0;
                }
            }

            let statusText = (item.status || "").trim().toUpperCase();
            if (statusText === "IN YARD") {
                countInYard++;
            }

            let tr = document.createElement('tr');

            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.container_no || ''}</td>
                <td>${dateInStr}</td>
                <td>${dateOutStr}</td>
                <td>${item.size || ''}</td>
                <td>${item.type || ''}</td>
                <td>${item.shipping_line || ''}</td>
                <td><strong style="color: #b22222;">${item.location || '-'}</strong></td>
                <td><b>${item.status || ''}</b></td>
                <td><b>${dayYard}</b></td>
                <td>${item.vessel_voy || ''}</td>
                <td>${item.check_repair || ''}</td>
                <td>${item.booking_no || ''}</td>
                <td>${item.remark || ''}</td>
                <td class="action-col">
                    <button onclick="alert('Container No: ${item.container_no}'); event.stopPropagation();">កែតម្រូវ</button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('txtTotalCon').innerText = countInYard;
    }

    function filterTable() {
        let keyword = document.getElementById('txtSearch').value.toLowerCase();
        let sizeKeyword = document.getElementById('txtSize').value.toLowerCase();
        
        let filtered = containerDataList.filter(item => {
            let cNo = (item.container_no || "").toLowerCase();
            let cSize = (item.size || "").toString().toLowerCase();
            
            let matchCNo = !keyword || cNo.includes(keyword);
            let matchSize = !sizeKeyword || cSize.includes(sizeKeyword);
            
            return matchCNo && matchSize;
        });

        renderTable(filtered);
    }

    function goBack() {
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
