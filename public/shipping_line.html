<script>
    const API_BASE = "https://my-accesses-api.onrender.com";

    let containerDataList = [];
    let shippingLineList = [];

    window.onload = async () => {
        updateDateTime();
        setInterval(updateDateTime, 1000);
        await loadShippingLines();

        let userRole = localStorage.getItem("currentUserRole") || "User";
        let userShippingLine = localStorage.getItem("currentShippingLine") || "";

        if (userRole.toLowerCase() === "shipping") {
            let cmbLine = document.getElementById('cmbShippingLine');
            if (cmbLine) {
                cmbLine.value = userShippingLine;
            }
            loadContainers(`shipping_line=${encodeURIComponent(userShippingLine)}`);
        } else {
            loadContainers();
        }
    };

    function updateDateTime() {
        const now = new Date();
        const formattedDate = now.toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
        const formattedTime = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        document.getElementById('currentDateTime').innerText = `${formattedDate}, ${formattedTime}`;
    }

    async function loadShippingLines() {
        try {
            let res = await fetch(`${API_BASE}/api/shipping-lines`);
            let json = await res.json();
            
            let filterSelect = document.getElementById('cmbShippingLine');
            filterSelect.innerHTML = '';

            let userRole = (localStorage.getItem("currentUserRole") || "User").toLowerCase();
            let userShippingLine = localStorage.getItem("currentShippingLine") || "";

            if (userRole === "shipping") {
                // បើជា Role Shipping គឺបង្ហាញតែឈ្មោះរបស់គាត់មួយគត់ក្នុង Dropdown ដើម្បីកុំឱ្យជ្រើសរើសក្រុមហ៊ុនដទៃកើត
                if (userShippingLine) {
                    let opt = document.createElement('option');
                    opt.value = userShippingLine;
                    opt.textContent = userShippingLine;
                    filterSelect.appendChild(opt);
                    filterSelect.value = userShippingLine;
                } else {
                    let opt = document.createElement('option');
                    opt.value = "";
                    opt.textContent = "-- No Shipping Line Assigned --";
                    filterSelect.appendChild(opt);
                }
            } else {
                // បើជា Admin ឬ User ធម្មតា គឺបង្ហាញគ្រប់ក្រុមហ៊ុនទាំងអស់ធម្មតា
                filterSelect.innerHTML = '<option value="">-- All Shipping Lines --</option>';
                if (json.data && Array.isArray(json.data)) {
                    shippingLineList = json.data;
                    json.data.forEach(item => {
                        let opt = document.createElement('option');
                        opt.value = item.shipping_line;
                        opt.textContent = item.shipping_line;
                        filterSelect.appendChild(opt);
                    });
                }
            }
        } catch (err) { console.error("Error loading shipping lines:", err); }
    }

    async function loadContainers(queryParam = "") {
        try {
            let userRole = localStorage.getItem("currentUserRole") || "User";
            let userShippingLine = localStorage.getItem("currentShippingLine") || "";

            if (userRole.toLowerCase() === "shipping" && userShippingLine) {
                queryParam = `shipping_line=${encodeURIComponent(userShippingLine)}`;
            }

            let url = `${API_BASE}/api/containers?${queryParam}`;
            let res = await fetch(url);
            let json = await res.json();
            
            if (json.data && Array.isArray(json.data)) containerDataList = json.data;
            else if (Array.isArray(json)) containerDataList = json;
            else containerDataList = [];

            renderTable(containerDataList);
        } catch (err) { console.error("Error loading containers:", err); }
    }

    function renderTable(data) {
        let tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let countInYard = 0;

        data.forEach((item, index) => {
            let rawDateIn = item.date_in || item.date_in_time || item.DATE_IN || item.DATE_IN_TIME || item.datein || "";
            let rawDateOut = item.date_out || item.date_out_time || item.DATE_OUT || "";

            let dateInStr = rawDateIn ? String(rawDateIn).replace("T", " ").replace("Z", "").substring(0, 19) : "";
            let dateOutStr = rawDateOut ? String(rawDateOut).replace("T", " ").replace("Z", "").substring(0, 19) : "";

            let dayYard = 0;
            if (dateInStr) {
                let dIn = new Date(dateInStr);
                dIn.setHours(0, 0, 0, 0);

                let dEnd = new Date();
                let statusVal = (item.status || "").toUpperCase();

                if (statusVal.includes("RELEASE") && rawDateOut) {
                    let dOut = new Date(dateOutStr);
                    if (!isNaN(dOut.getTime())) dEnd = dOut;
                }
                dEnd.setHours(0, 0, 0, 0);

                if (!isNaN(dIn.getTime())) {
                    let diffTime = dEnd - dIn;
                    let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    dayYard = diffDays >= 0 ? diffDays : 0;
                }
            }

            if ((item.status || "").toUpperCase() === "IN YARD") countInYard++;

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td>${item.container_no || ''}</td>
                <td>${dateInStr}</td>
                <td>${dateOutStr}</td>
                <td>${item.size || ''}</td>
                <td>${item.type || ''}</td>
                <td>${item.shipping_line || ''}</td>
                <td><strong style="color: #b22222;">${item.location || '-'}</strong></td>
                <td><b>${item.status || ''}</b></td>
                <td><b>${dayYard}</b></td>
                <td>${item.vessel_voy || ''}</td>
                <td>${item.check_repair || ''}</td>
                <td>${item.booking_no || ''}</td>
                <td>${item.remark || ''}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('txtTotalCon').innerText = countInYard;
    }

    function filterByShippingLine() {
        let userRole = (localStorage.getItem("currentUserRole") || "User").toLowerCase();
        let userShippingLine = localStorage.getItem("currentShippingLine") || "";

        let line = document.getElementById('cmbShippingLine').value;
        if (userRole === "shipping") {
            line = userShippingLine; // ကာពារកុំឱ្យប្តូរ
        }

        loadContainers(line ? `shipping_line=${encodeURIComponent(line)}` : "");
    }

    function searchContainer() {
        let searchKey = document.getElementById('txtContainerSearch').value.trim();
        let userRole = (localStorage.getItem("currentUserRole") || "User").toLowerCase();
        let userShippingLine = localStorage.getItem("currentShippingLine") || "";

        let query = searchKey ? `container_no=${encodeURIComponent(searchKey)}` : "";
        if (userRole === "shipping" && userShippingLine) {
            query += (query ? "&" : "") + `shipping_line=${encodeURIComponent(userShippingLine)}`;
        }
        loadContainers(query);
    }

    function filterBySizeKey(event) {
        if (event.key === "Enter") {
            let sizeVal = document.getElementById('txtSearchBySize').value.trim();
            let userRole = (localStorage.getItem("currentUserRole") || "User").toLowerCase();
            let userShippingLine = localStorage.getItem("currentShippingLine") || "";

            let query = sizeVal ? `size=${encodeURIComponent(sizeVal)}` : "";
            if (userRole === "shipping" && userShippingLine) {
                query += (query ? "&" : "") + `shipping_line=${encodeURIComponent(userShippingLine)}`;
            }
            loadContainers(query);
        }
    }

    function saveAsPDF() { window.print(); }
</script>
