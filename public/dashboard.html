<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER MAIN MENU</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #141e30, #243b55); 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .menu-container { 
            background: #ffffff; 
            width: 100%;
            max-width: 1000px;
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.4); 
            border: 3px solid #ffcc00;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #8b0000, #b22222);
            color: white;
            padding: 18px 25px;
            margin: -35px -35px 30px -35px;
            border-top-left-radius: 9px;
            border-top-right-radius: 9px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .top-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-box {
            border: 2px solid #b0c4de;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
            background: #fdfefe;
        }
        .section-title {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #fdfefe;
            padding: 0 10px;
            font-size: 15px;
            font-weight: bold;
            color: #111;
            letter-spacing: 0.5px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }
        .btn { 
            padding: 14px 16px; 
            border: 2px solid #243b55; 
            border-radius: 6px; 
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #ffffff;
            color: #243b55;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover:not(:disabled) { 
            background: #243b55; 
            color: #fff;
            border-color: #141e30; 
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .btn-danger {
            color: #ffffff;
            background: #b22222;
            border-color: #8b0000;
            width: 100%;
            padding: 16px;
            font-size: 16px;
        }
        .btn-danger:hover:not(:disabled) { background: #8b0000; }
        .btn:disabled {
            background: #e9ecef;
            color: #6c757d;
            border-color: #dee2e6;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .action-btn {
            background: #fff;
            color: #b22222;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .action-btn:hover:not(:disabled) { background: #ffcc00; color: #000; }
        .action-btn:disabled {
            background: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
            width: 450px;
            max-width: 95%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 2px solid #ddd; padding-bottom: 10px; color: #243b55; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #333; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="menu-container">
    <div class="top-bar">
        <div class="top-title">
            <span>🚢 ANT DRY PORT - MAIN MENU</span>
        </div>
        <div class="top-actions">
            <span id="lblUserRole" style="font-size: 14px; font-weight: bold;">Role: User</span>
            <!-- 🟢 ប៊ូតុង Account មាន ID សម្រាប់ងាយស្រួលគ្រប់គ្រងការ Disable -->
            <button class="action-btn" id="btnAccount" onclick="openAccountModal()">⚙️ Account</button>
            <button class="action-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </div>
    
    <!-- CLEAR ALL DATA -->
    <div class="section-box" id="boxClearData" style="border-color: #b22222; display: none;">
        <span class="section-title" style="color: #b22222;">⚠️ CLEAR ALL DATA</span>
        <button class="btn btn-danger" onclick="clearAllData()">🗑️ CLEAR ALL DATA FROM CLOUD</button>
    </div>

    <!-- FOR ADMIN -->
    <div class="section-box" id="boxAdminSection" style="display: none;">
        <span class="section-title">🛡️ FOR ADMIN</span>
        <div class="button-grid">
            <button class="btn" onclick="openPage('dashboard_chart.html')">📈 DASHBOARD & CHART</button>
            <button class="btn" onclick="openPage('user_activity.html')">📋 USER ACTIVITY</button>
            <button class="btn" onclick="openPage('user_management.html')">👥 USER MANAGEMENT</button>
            <button class="btn" onclick="openPage('user_report.html')">📊 USER REPORT</button>
            <button class="btn" onclick="openPage('shipping_line_manager.html')">🚢 SHIPPING LINE MANAGER</button>
            <button class="btn" onclick="openPage('location_manager.html')">📍 LOCATION MANAGER</button>
        </div>
    </div>

    <!-- FOR USER CLIENT / SHIPPING LINE -->
    <div class="section-box">
        <span class="section-title">📦 FOR USER CLIENT</span>
        <div class="button-grid">
            <button class="btn" id="btnContainerStockIn" onclick="openPage('stock_in.html')">📥 CONTAINER STOCK IN</button>
            <button class="btn" id="btnContainerShippingLine" onclick="openPage('shipping_line.html')">🌐 CONTAINER SHIPPING LINE</button>
            <button class="btn" id="btnContainerRepair" onclick="openPage('repair.html')">🔧 CONTAINER REPAIR</button>
            <button class="btn" id="btnContainerDateIn" onclick="openPage('date_in.html')">📅 CONTAINER DATE IN</button>
            <button class="btn" id="btnReportContainerRepair" onclick="openPage('report_repair.html')">📝 REPORT CONTAINER REPAIR</button>
        </div>
    </div>
</div>

<!-- Popup Modal សម្រាប់ដូរ Username & Password -->
<div id="accountModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">⚙️ កែប្រែ Username & Password ផ្ទាល់ខ្លួន</div>
        <form id="accountForm" onsubmit="saveAccountChanges(event)">
            <div class="form-group">
                <label>Username ថ្មី</label>
                <input type="text" id="txtNewUsername" required>
            </div>
            <div class="form-group">
                <label>Password ចាស់ (ផ្ទៀងផ្ទាត់)</label>
                <input type="password" id="txtOldPassword" placeholder="បញ្ចូលពាក្យសម្ងាត់ចាស់..." required>
            </div>
            <div class="form-group">
                <label>Password ថ្មី</label>
                <input type="password" id="txtNewPassword" placeholder="ទុកទទេបើមិនចង់ដូរ...">
            </div>
            <div class="form-group">
                <label>បញ្ជាក់ Password ថ្មី (Confirm)</label>
                <input type="password" id="txtConfirmPassword" placeholder="បញ្ជាក់ពាក្យសម្ងាត់ថ្មី...">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn" style="background:#6c757d; color:#fff; width:auto;" onclick="closeAccountModal()">❌ បោះបង់</button>
                <button type="submit" class="btn" style="background:#28a745; color:#fff; width:auto;">💾 រក្សាទុក (Save)</button>
            </div>
        </form>
    </div>
</div>

<script>
    const API_BASE = "https://my-accesses-api.onrender.com";

    window.onload = function() {
        let currentRole = (localStorage.getItem("currentUserRole") || localStorage.getItem("role") || "User").trim().toLowerCase();
        document.getElementById("lblUserRole").innerText = "Role: " + currentRole;

        if (currentRole === "admin") {
            document.getElementById("boxClearData").style.display = "block";
            document.getElementById("boxAdminSection").style.display = "block";
        } 
        else if (currentRole === "shipping_line" || currentRole === "shipping") {
            document.getElementById("boxClearData").style.display = "none";
            document.getElementById("boxAdminSection").style.display = "none";

            // 🟢 បិទប៊ូតុង Account មិនឱ្យចុចសម្រាប់ Shipping Line
            let btnAcc = document.getElementById("btnAccount");
            if(btnAcc) btnAcc.disabled = true;

            // 🟢 បិទមុខងារដទៃទៀតដែលមិនពាក់ព័ន្ធ
            document.getElementById("btnContainerStockIn").disabled = true;
            document.getElementById("btnContainerRepair").disabled = true;
            document.getElementById("btnContainerDateIn").disabled = true;

            // 🟢 បើកឱ្យប្រើប្រាស់បានតែ ២ នេះគត់
            document.getElementById("btnContainerShippingLine").disabled = false;
            document.getElementById("btnReportContainerRepair").disabled = false;
        }
    };

    function openPage(pageName) {
        window.location.href = pageName;
    }

    function openAccountModal() {
        let currentRole = (localStorage.getItem("currentUserRole") || "").trim().toLowerCase();
        if (currentRole === "shipping_line" || currentRole === "shipping") {
            alert("❌ បដិសេធ! គណនី Shipping Line មិនមានសិទ្ធិកែប្រែ Account ទេ។");
            return;
        }

        let currentUsername = localStorage.getItem("currentUser") || "";
        document.getElementById("txtNewUsername").value = currentUsername;
        document.getElementById("txtOldPassword").value = "";
        document.getElementById("txtNewPassword").value = "";
        document.getElementById("txtConfirmPassword").value = "";
        document.getElementById("accountModal").style.display = "flex";
    }

    function closeAccountModal() {
        document.getElementById("accountModal").style.display = "none";
    }

    async function saveAccountChanges(e) {
        e.preventDefault();
        let oldUsername = localStorage.getItem("currentUser");
        let newUsername = document.getElementById("txtNewUsername").value.trim();
        let oldPassword = document.getElementById("txtOldPassword").value;
        let newPassword = document.getElementById("txtNewPassword").value;
        let confirmPassword = document.getElementById("txtConfirmPassword").value;

        if (newPassword && newPassword !== confirmPassword) {
            return alert("❌ Password ថ្មី និងការបញ្ជាក់ Password មិនត្រូវគ្នាទេ!");
        }

        let payload = {
            old_username: oldUsername,
            new_username: newUsername,
            old_password: oldPassword,
            new_password: newPassword
        };

        try {
            let res = await fetch(`${API_BASE}/api/users/change-credentials`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            let resultJson = await res.json().catch(() => ({}));

            if (res.ok) {
                alert("✅ ផ្លាស់ប្តូរព័ត៌មានគណនីបានជោគជ័យ! សូមធ្វើការ Login ជាថ្មី។");
                localStorage.setItem("currentUser", newUsername);
                closeAccountModal();
                if (newPassword) {
                    logout();
                }
            } else {
                alert("❌ បរាជ័យ: " + (resultJson.message || resultJson.error || "ពិនិត្យមើល Password ចាស់ឡើងវិញ!"));
            }
        } catch (err) {
            alert("❌ មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Server!");
        }
    }

    function logout() {
        localStorage.removeItem("currentUser");
        localStorage.removeItem("currentUserRole");
        localStorage.removeItem("shippingLine");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
