<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTAINER STOCK IN</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container { 
            background: white; 
            width: 100%;
            max-width: 800px;
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-top: 5px solid #d9534f;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 10px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }

        /* කොටសរូបភាពកុងតឺន័រខាងលើ */
        .header-images {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
            padding-bottom: 15px;
        }
        .header-images img {
            height: 60px;
            object-fit: contain;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { 
            margin-bottom: 15px; 
        }

        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            color: #333; 
            font-weight: bold; 
            font-size: 14px;
        }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px; 
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #007bff;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        .btn { 
            padding: 10px 25px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer; 
            background: #f8f9fa;
            transition: background 0.2s;
        }
        .btn-save { background-color: #e9ecef; color: #000; border-color: #ced4da; }
        .btn-save:hover { background-color: #d1e7dd; border-color: #badbcc; }
        
        .btn-close { background-color: #e9ecef; color: #000; border-color: #ced4da; }
        .btn-close:hover { background-color: #f8d7da; border-color: #f5c6cb; }

        .btn-clear { background-color: #e9ecef; color: #000; border-color: #ced4da; }
        .btn-clear:hover { background-color: #fff3cd; border-color: #ffeeba; }
    </style>
</head>
<body>

<div class="form-container">
    <a href="/dashboard.html" class="back-link">← ត្រឡប់ទៅ Main Menu</a>
    
    <!-- រូបភាពកុងតឺន័រខាងលើ (យកតាមទម្រង់ MS Access ដើម) -->
    <div class="header-images">
        <img src="https://cdn-icons-png.flaticon.com/512/3067/3067400.png" alt="Red Container">
        <img src="https://cdn-icons-png.flaticon.com/512/3067/3067400.png" alt="Blue Container" style="filter: hue-rotate(180deg);">
        <img src="https://cdn-icons-png.flaticon.com/512/3067/3067400.png" alt="Stack Container" style="filter: hue-rotate(120deg);">
        <img src="https://cdn-icons-png.flaticon.com/512/3067/3067400.png" alt="Yellow Container" style="filter: hue-rotate(50deg);">
    </div>
    
    <form id="stockInForm">
        <div class="form-grid">
            <!-- ជួរទី ១ -->
            <div class="form-group">
                <label for="container_no">CONTAINER_No</label>
                <input type="text" id="container_no" required autocomplete="off" placeholder="ឧ. TCUU1234567">
            </div>
            <div class="form-group">
                <label for="vessel_voy">VESSEL/VOY</label>
                <input type="text" id="vessel_voy" autocomplete="off">
            </div>

            <!-- ជួរទី ២ -->
            <div class="form-group">
                <label for="size">SIZE</label>
                <select id="size">
                    <option value="20">20</option>
                    <option value="40">40</option>
                    <option value="45">45</option>
                </select>
            </div>
            <div class="form-group">
                <label for="booking_no">BOOKING_No</label>
                <input type="text" id="booking_no" autocomplete="off">
            </div>

            <!-- ជួរទី ៣ -->
            <div class="form-group">
                <label for="type">TYPE</label>
                <select id="type">
                    <option value="GP">GP</option>
                    <option value="HC">HC</option>
                    <option value="OT">OT</option>
                    <option value="RF">RF</option>
                </select>
            </div>
            <div class="form-group">
                <label for="remark">REMARK</label>
                <input type="text" id="remark" autocomplete="off">
            </div>

            <!-- ជួរទី ៤ (SHIPPING LINE នៅខាងឆ្វេងក្រោម) -->
            <div class="form-group">
                <label for="shipping_line">SHIPPING LINE</label>
                <select id="shipping_line" required>
                    <option value="">-- ជ្រើសរើស Shipping Line --</option>
                </select>
            </div>
        </div>

        <div class="button-group">
            <button type="submit" class="btn btn-save">SAVE</button>
            <button type="button" class="btn btn-clear" onclick="clearForm()">CLEAR</button>
            <button type="button" class="btn btn-close" onclick="window.location.href='/dashboard.html'">CLOSE</button>
        </div>
    </form>
</div>

<script>
    const API_BASE = "https://my-accesses-api.onrender.com";

    async function loadShippingLines() {
        try {
            let response = await fetch(`${API_BASE}/api/shipping-lines`);
            let result = await response.json();
            
            let select = document.getElementById('shipping_line');
            select.innerHTML = '<option value="">-- ជ្រើសរើស Shipping Line --</option>';
            
            if (result.data && Array.isArray(result.data)) {
                result.data.forEach(item => {
                    let opt = document.createElement('option');
                    opt.value = item.shipping_line;
                    opt.textContent = item.shipping_line;
                    select.appendChild(opt);
                });
            }
        } catch (error) {
            console.error("Error loading shipping lines:", error);
        }
    }

    function isValidContainerNo(strCont) {
        const regex = /^[A-Z]{4}[0-9]{7}$/;
        return regex.test(strCont.toUpperCase());
    }

    document.getElementById('stockInForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        let strContNo = document.getElementById('container_no').value.trim().toUpperCase();
        let size = document.getElementById('size').value;
        let type = document.getElementById('type').value;
        let shipping_line = document.getElementById('shipping_line').value;
        let vessel_voy = document.getElementById('vessel_voy').value.trim();
        let booking_no = document.getElementById('booking_no').value.trim();
        let remark = document.getElementById('remark').value.trim();

        if (!isValidContainerNo(strContNo)) {
            alert("Invalid Container Number format! It must consist of 4 letters followed by 7 digits (e.g. TCUU1234567).");
            document.getElementById('container_no').focus();
            return;
        }

        try {
            let checkRes = await fetch(`${API_BASE}/api/containers/check-duplicate?container_no=${strContNo}`);
            let checkData = await checkRes.json();
            
            if (checkData.exists) {
                alert(`Container Number '${strContNo}' is already IN YARD on Cloud Database!`);
                document.getElementById('container_no').focus();
                return;
            }

            let saveRes = await fetch(`${API_BASE}/api/containers`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    container_no: strContNo,
                    size: size,
                    type: type,
                    shipping_line: shipping_line,
                    vessel_voy: vessel_voy,
                    booking_no: booking_no,
                    remark: remark
                })
            });

            if (saveRes.status === 201 || saveRes.ok) {
                alert(`Container '${strContNo}' saved to Cloud Database successfully!`);
                clearForm();
            } else {
                alert("Failed to save container to Cloud!");
            }

        } catch (error) {
            console.error("Error:", error);
            alert("មានបញ្ហាក្នុងការតភ្ជាប់ទៅកាន់ Cloud Server!");
        }
    });

    function clearForm() {
        document.getElementById('stockInForm').reset();
        document.getElementById('container_no').focus();
    }

    window.onload = () => {
        loadShippingLines();
        document.getElementById('container_no').focus();
    };
</script>

</body>
</html>
