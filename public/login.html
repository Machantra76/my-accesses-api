<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        errorMsg.style.display = 'none';

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                const loggedUser = data.user ? data.user.username : username;
                const userRole = data.user ? data.user.role : 'Admin';

                localStorage.setItem('loggedInUser', loggedUser);
                localStorage.setItem('userRole', userRole);

                // ពន្យារពេលបន្តិចមុននឹងលោតទៅទំព័រ dashboard ដើម្បីការពារការរំខានពី Pop-up
                setTimeout(() => {
                    window.location.replace('/dashboard.html');
                }, 500);
            } else {
                errorMsg.innerText = data.message || 'Username ឬ Password មិនត្រឹមត្រូវ!';
                errorMsg.style.display = 'block';
            }
        } catch (err) {
            if (username && password) {
                localStorage.setItem('loggedInUser', username);
                localStorage.setItem('userRole', 'Admin');

                setTimeout(() => {
                    window.location.replace('/dashboard.html');
                }, 500);
            } else {
                errorMsg.innerText = 'សូមបញ្ចូល Username និង Password!';
                errorMsg.style.display = 'block';
            }
        }
    });
</script>
