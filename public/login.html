<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER LOG IN</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef2f5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: white; 
            padding: 35px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 380px; 
        }
        .login-card h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 25px; 
            font-size: 22px; 
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #495057; 
            font-weight: bold; 
            font-size: 14px;
        }
        .form-group input { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #ced4da; 
            border-radius: 5px; 
            font-size: 14px; 
            outline: none;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background-color: #007bff; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover { 
            background-color: #0056b3; 
        }
        .error-msg { 
            color: #dc3545; 
            font-size: 14px; 
            text-align: center; 
            margin-top: 15px; 
            display: none; 
            background: #f8d7da;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>USER LOG IN</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
            <input type="text" id="username" placeholder="បញ្ចូល Username..." required autocomplete="off">
        </div>
        <div class="form-group">
            <label for="password">ពាក្យសម្ងាត់ (Password)</label>
            <!-- ប្រើ type="password" សម្រាប់សុវត្ថិភាពទូទៅ ប៉ុន្តែបើចង់មិនឱ្យ Chrome សួរ save password អាចប្ដូរជា type="text" បាន -->
            <input type="password" id="password" placeholder="បញ្ចូល Password..." required autocomplete="off">
        </div>
        <button type="submit" class="btn-login">ចូលប្រព័ន្ធ (LOGIN)</button>
        <div id="errorMsg" class="error-msg">សូមបញ្ចូល Username និង Password!</div>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        if (username !== "" && password !== "") {
            try {
                // ផ្ញើសំណើ POST ទៅកាន់ API ផ្ទៀងផ្ទាត់ការ Login ដូច VBA Access
                let response = await fetch("https://my-accesses-api.onrender.com/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username: username, password: password })
                });

                if (response.ok) {
                    let result = await response.json();
                    console.log("Login API Response:", result);

                    // រក្សាទុក Username ក្នុង localStorage
                    localStorage.setItem('loggedInUser', username);

                    // ចាប់យក Role ពី API Response ដោយស្វ័យប្រវត្តិ ( Admin ឬ User )
                    let userRole = result.role || result.Role || "User";
                    localStorage.setItem('userRole', userRole);

                    // ប្ដូរទំព័រទៅកាន់ Dashboard ឬ Main Menu របស់អ្នក
                    window.location.replace('/dashboard.html');
                } else {
                    errorMsg.innerText = "ឈ្មោះអ្នកប្រើប្រាស់ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ!";
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                console.error("Connection Error:", error);
                errorMsg.innerText = "មានបញ្ហាในการតភ្ជាប់ទៅកាន់ სերဗើ (Server Connection Error)!";
                errorMsg.style.display = 'block';
            }
        } else {
            errorMsg.innerText = "សូមបញ្ចូល Username និង Password!";
            errorMsg.style.display = 'block';
        }
    });
</script>

</body>
</html>
