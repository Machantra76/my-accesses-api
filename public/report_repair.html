<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>REPORT CONTAINER REPAIR</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 20px; }
        .box { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #007bff; color: white; }
        .btn-back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; }
        .btn-load { padding: 8px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <a href="dashboard.html" class="btn-back">← ត្រឡប់ទៅ Main Menu</a>
    <h3>REPORT CONTAINER REPAIR</h3>
    <button class="btn-load" onclick="loadReport()">ទាញយកទិន្នន័យ Report</button>
    
    <table>
        <thead>
            <tr>
                <th>Container No</th>
                <th>Status / Action</th>
                <th>Date</th>
                <th>User</th>
            </tr>
        </thead>
        <tbody id="reportTable">
            <tr><td colspan="4" style="text-align:center;">សូមចុចប៊ូតុងខាងលើដើម្បីទាញយកទិន្នន័យ</td></tr>
        </tbody>
    </table>
</div>

<script>
    async function loadReport() {
        try {
            const res = await fetch('/api/reports/repair');
            const data = await res.json();
            const tbody = document.getElementById('reportTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">គ្មានទិន្នន័យ</td></tr>';
                return;
            }

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.container_no || '-'}</td>
                        <td>${item.repair_details || item.status || '-'}</td>
                        <td>${item.created_at ? new Date(item.created_at).toLocaleDateString() : '-'}</td>
                        <td>${item.username || '-'}</td>
                    </tr>
                `;
            });
        } catch(err) {
            alert('Error loading report: ' + err.message);
        }
    }
</script>

</body>
</html>
