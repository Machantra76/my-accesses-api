<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORT CONTAINER REPAIR</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            border: 2px solid #b22222;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #b22222;
            color: white;
            padding: 10px 20px;
            margin: -25px -25px 20px -25px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            font-weight: bold;
        }
        .btn-back {
            background: #fff;
            color: #b22222;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-back:hover { background: #f1f1f1; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px 10px;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span>📊 REPORT CONTAINER REPAIR</span>
        <button class="btn-back" onclick="goBack()">← Back to Menu</button>
    </div>

    <div class="table-responsive">
        <table id="repairTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Container No</th>
                    <th>Repair Date</th>
                    <th>Shipping Line</th>
                    <th>Size</th>
                    <th>Type</th>
                    <th>Day In Repair</th>
                    <th>Status</th>
                    <th>Complete Date</th>
                    <th>Vessel/Voy</th>
                    <th>Check Repair</th>
                    <th>Damage Type</th>
                    <th>Description</th>
                    <th>Vendor</th>
                    <th>Est Cost</th>
                    <th>Act Cost</th>
                    <th>Remark</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="17" class="loading">Loading data from Cloud API...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = "https://my-accesses-api.onrender.com";

    window.onload = function() {
        loadContainerRepairData();
    };

    async function loadContainerRepairData() {
        try {
            let response = await fetch(`${API_BASE}/api/container-repairs-report`);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            let result = await response.json();
            console.log("API Raw Response:", result);

            // កំណត់ទាញយកទិន្នន័យមិនថា JSON ស្ថិតក្នុង Array ឬ Object ឡើយ
            let data = [];
            if (Array.isArray(result)) {
                data = result;
            } else if (result.data && Array.isArray(result.data)) {
                data = result.data;
            } else if (result.rows && Array.isArray(result.rows)) {
                data = result.rows;
            } else {
                // ប្រសិនបើវាជា Object ទោលដែលមានទិន្នន័យខាងក្នុង
                data = Object.values(result).find(val => Array.isArray(val)) || [];
            }
            
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="17" class="loading" style="color:orange;">No data found in API response.</td></tr>`;
                return;
            }

            let index = 1;
            data.forEach(item => {
                let repairDate = item.repair_date_in_time ? item.repair_date_in_time.replace("T", " ").substring(0, 19) : "";
                let completeDate = item.complete_date ? item.complete_date.replace("T", " ").substring(0, 19) : "";

                let row = `<tr>
                    <td>${index++}</td>
                    <td>${item.container_no || ""}</td>
                    <td>${repairDate}</td>
                    <td>${item.shipping_line || ""}</td>
                    <td>${item.size || ""}</td>
                    <td>${item.type || ""}</td>
                    <td>${item.day_in_repair || ""}</td>
                    <td>${item.repair_status || ""}</td>
                    <td>${completeDate}</td>
                    <td>${item.vessel_voy || ""}</td>
                    <td>${item.check_repair || ""}</td>
                    <td>${item.damage_type || ""}</td>
                    <td>${item.damage_discription || item.damage_description || ""}</td>
                    <td>${item.vender || item.vendor || ""}</td>
                    <td>${item.est_cost || ""}</td>
                    <td>${item.act_cost || ""}</td>
                    <td>${item.remark || ""}</td>
                </tr>`;
                tbody.innerHTML += row;
            });

        } catch (error) {
            console.error("Error loading repair data:", error);
            document.getElementById("tableBody").innerHTML = `<tr><td colspan="17" class="loading" style="color:red;">Error loading data: ${error.message}</td></tr>`;
        }
    }

    function goBack() {
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
