<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORT CONTAINER REPAIR</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: #eef2f5; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            background: #ffffff; 
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15); 
            border: 2px solid #b22222;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #b22222;
            color: white;
            padding: 10px 20px;
            margin: -25px -25px 20px -25px;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            font-weight: bold;
        }
        .btn-back {
            background: #fff;
            color: #b22222;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-back:hover { background: #f1f1f1; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            max-height: 600px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px 10px;
        }
        th {
            background-color: #f2f2f2;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .loading {
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #666;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span>📊 REPORT CONTAINER REPAIR</span>
        <button class="btn-back" onclick="goBack()">← Back to Menu</button>
    </div>

    <div class="table-responsive">
        <table id="repairTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Container No</th>
                    <th>Repair Date</th>
                    <th>Shipping Line</th>
                    <th>Size</th>
                    <th>Type</th>
                    <th>Day In Repair</th>
                    <th>Status</th>
                    <th>Complete Date</th>
                    <th>Vessel/Voy</th>
                    <th>Check Repair</th>
                    <th>Damage Type</th>
                    <th>Description</th>
                    <th>Vendor</th>
                    <th>Est Cost</th>
                    <th>Act Cost</th>
                    <th>Remark</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="17" class="loading">Loading data from Cloud API...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const API_BASE = "https://my-accesses-api.onrender.com";

    window.onload = function() {
        loadContainerRepairData();
    };

    async function loadContainerRepairData() {
        let tbody = document.getElementById("tableBody");
        try {
            // សាកល្បង Fetch តាម Endpoint
            let response = await fetch(`${API_BASE}/api/container-repairs-report`);
            
            // ប្រសិនបើ Endpoint ដំបូងមិនដើរ សាកល្បងទៅ Endpoint ជំនួស
            if (!response.ok) {
                response = await fetch(`${API_BASE}/api/container-repairs`);
            }

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            
            let result = await response.json();
            console.log("API Raw Response:", result);

            let data = [];
            if (Array.isArray(result)) {
                data = result;
            } else if (result.data && Array.isArray(result.data)) {
                data = result.data;
            } else if (result.rows && Array.isArray(result.rows)) {
                data = result.rows;
            } else {
                for (let key in result) {
                    if (Array.isArray(result[key])) {
                        data = result[key];
                        break;
                    }
                }
            }
            
            tbody.innerHTML = "";

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="17" class="loading" style="color:orange;">រកមិនឃើញទិន្នន័យក្នុង API Response ទេ</td></tr>`;
                return;
            }

            let index = 1;
            let rowsHtml = "";

            data.forEach(item => {
                let containerNo = item.container_no || item.CONTAINER_No || item.ContainerNo || item.CONTAINER_NO || "";
                let rawRepairDate = item.repair_date_in_time || item.REPAIR_DATE_IN_TIME || item.RepairDateInTime || item.repair_date || "";
                let repairDate = rawRepairDate ? String(rawRepairDate).replace("T", " ").substring(0, 19) : "";
                
                let shippingLine = item.shipping_line || item.SHIPPING_LINE || item.ShippingLine || "";
                let size = item.size || item.SIZE || item.Size || "";
                let type = item.type || item.TYPE || item.Type || "";
                
                // 🟢 ស្វែងរក Day in Repair ឬគណនាស្វ័យប្រវត្ត ប្រសិនបើតម្លៃជា 0 ឬទំនេរ
                let dayInRepair = item.day_in_repair || item.DAY_IN_REPAIR || item.DayInRepair || "";
                if ((!dayInRepair || dayInRepair === "0" || dayInRepair === 0) && rawRepairDate) {
                    let rDate = new Date(rawRepairDate);
                    let today = new Date();
                    if (!isNaN(rDate.getTime())) {
                        let diffTime = Math.abs(today - rDate);
                        dayInRepair = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                    }
                }
                
                let repairStatus = item.repair_status || item.REPAIR_STATUS || item.RepairStatus || "";
                
                let rawCompleteDate = item.complete_date || item.COMPLETE_DATE || item.CompleteDate || "";
                let completeDate = rawCompleteDate ? String(rawCompleteDate).replace("T", " ").substring(0, 19) : "";
                
                let vesselVoy = item.vessel_voy || item.VESSEL_VOY || item.VesselVoy || "";
                let checkRepair = item.check_repair || item.CHECK_REPAIR || item.CheckRepair || "";
                let damageType = item.damage_type || item.DAMAGE_TYPE || item.DamageType || "";
                let damageDesc = item.damage_discription || item.DAMAGE_DISCRIPTION || item.damage_description || item.DamageDescription || "";
                let vendor = item.vender || item.VENDER || item.vendor || item.Vendor || "";
                let estCost = item.est_cost || item.EST_COST || item.EstCost || "";
                let actCost = item.act_cost || item.ACT_COST || item.ActCost || "";
                let remark = item.remark || item.REMARK || item.Remark || "";

                rowsHtml += `<tr>
                    <td>${index++}</td>
                    <td>${containerNo}</td>
                    <td>${repairDate}</td>
                    <td>${shippingLine}</td>
                    <td>${size}</td>
                    <td>${type}</td>
                    <td><b>${dayInRepair}</b></td>
                    <td>${repairStatus}</td>
                    <td>${completeDate}</td>
                    <td>${vesselVoy}</td>
                    <td>${checkRepair}</td>
                    <td>${damageType}</td>
                    <td>${damageDesc}</td>
                    <td>${vendor}</td>
                    <td>${estCost}</td>
                    <td>${actCost}</td>
                    <td>${remark}</td>
                </tr>`;
            });

            tbody.innerHTML = rowsHtml;

        } catch (error) {
            console.error("Error loading repair data:", error);
            tbody.innerHTML = `<tr><td colspan="17" class="loading" style="color:red;">Error: ${error.message}</td></tr>`;
        }
    }

    function goBack() {
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
