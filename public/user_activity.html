<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>USER ACTIVITY LOG</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 20px; }
        .box { max-width: 850px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #343a40; color: white; }
        .btn-back { display: inline-block; margin-bottom: 15px; text-decoration: none; color: #007bff; }
    </style>
</head>
<body>

<div class="box">
    <a href="dashboard.html" class="btn-back">← ត្រឡប់ទៅ Main Menu</a>
    <h3>USER ACTIVITY LOG</h3>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Action</th>
                <th>Details</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="activityTable">
            <tr><td colspan="5" style="text-align:center;">កំពុងទាញយកទិន្នន័យ...</td></tr>
        </tbody>
    </table>
</div>

<script>
    async function loadActivities() {
        try {
            const res = await fetch('/api/activity-log');
            const data = await res.json();
            const tbody = document.getElementById('activityTable');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">គ្មាន Activity ឡើយ</td></tr>';
                return;
            }

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.id || '-'}</td>
                        <td><strong>${item.username || '-'}</strong></td>
                        <td>${item.action || '-'}</td>
                        <td>${item.details || '-'}</td>
                        <td>${item.created_at ? new Date(item.created_at).toLocaleString() : '-'}</td>
                    </tr>
                `;
            });
        } catch(err) {
            console.error(err);
        }
    }

    loadActivities();
</script>

</body>
</html>
